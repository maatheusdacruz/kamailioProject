global
    log stdout format raw local0 info
    maxconn 50000
    stats timeout 30s

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  120s
    timeout server  120s
    retries 3

# ── SIP TCP (port 5060 → Kamailio:5061) ────────────────────────────────────
frontend sip_tcp_in
    bind *:5060
    default_backend kamailio_nodes

backend kamailio_nodes
    balance roundrobin
    option  tcp-check
    # Single node for development; add kamailio2 at 127.0.0.1:5062 for HA
    server  kamailio1 127.0.0.1:5061 check inter 5s rise 2 fall 3

# ── Stats page (http://host:8404/stats) ────────────────────────────────────
listen stats
    bind  *:8404
    mode  http
    stats enable
    stats uri  /stats
    stats refresh 10s
