# Network architecture:
#   HAProxy  (host network) → port 5060 external SIP entry
#   Kamailio (host network) → port 5061 SIP, port 5064 JSONRPC (Siremis)
#   FreeSWITCH (host network) → port 5080, receives from Kamailio
#   AMD service  (bridge)  → exposed on 127.0.0.1:8080
#   Siremis      (bridge)  → exposed on 127.0.0.1:8088
#   PostgreSQL   (bridge)  → exposed on 127.0.0.1:5432
#   Redis        (bridge)  → exposed on 127.0.0.1:6379
#
# Host-network services reach bridge services via 127.0.0.1 (published ports).

services:

  # ── Load Balancer ─────────────────────────────────────────────────────────
  haproxy:
    image: haproxy:2.8-alpine
    network_mode: host
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      - kamailio

  # ── SIP Control Layer ──────────────────────────────────────────────────────
  kamailio:
    build:
      context: ./kamailio
    network_mode: host
    volumes:
      - ./kamailio/config:/etc/kamailio:ro
    environment:
      - DB_USER=${DB_USER:-kamailio}
      - DB_PASS=${DB_PASS:-kamailio}
      - DB_NAME=${DB_NAME:-kamailio}
      - DB_URL=postgres://${DB_USER:-kamailio}:${DB_PASS:-kamailio}@postgres:5432/${DB_NAME:-kamailio}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Media Layer ────────────────────────────────────────────────────────────
  freeswitch:
    build:
      context: ./freeswitch
      args:
        SIGNALWIRE_TOKEN: ${SIGNALWIRE_TOKEN}
    network_mode: host
    volumes:
      - freeswitch_recordings:/var/lib/freeswitch/recordings
      - freeswitch_logs:/var/log/freeswitch
    environment:
      - AMD_SERVICE_URL=${AMD_SERVICE_URL:-http://127.0.0.1:8080}
    depends_on:
      amd_service:
        condition: service_healthy
    restart: unless-stopped

  # ── AMD Intelligence Layer ─────────────────────────────────────────────────
  amd_service:
    build:
      context: ./amd_service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WORKERS=${AMD_WORKERS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Web Management (Siremis) ───────────────────────────────────────────────
  siremis:
    build:
      context: ./siremis
    ports:
      - "127.0.0.1:8088:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kamailio:
        condition: service_started
    restart: unless-stopped

  # ── Data Layer ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASS:-siremis123}
      - MYSQL_DATABASE=siremis
      - MYSQL_USER=siremis
      - MYSQL_PASSWORD=${MYSQL_PASS:-siremis}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./siremis/siremis-modules.sql:/docker-entrypoint-initdb.d/02-siremis-modules.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASS:-siremis123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-kamailio}
      - POSTGRES_PASSWORD=${DB_PASS:-kamailio}
      - POSTGRES_DB=${DB_NAME:-kamailio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kamailio} -d ${DB_NAME:-kamailio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  freeswitch_recordings:
  freeswitch_logs:
