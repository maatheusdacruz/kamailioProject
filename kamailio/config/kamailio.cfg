#!KAMAILIO
#
# Kamailio SIP proxy – outbound call routing to FreeSWITCH
# Listens on port 5061 (behind HAProxy on 5060).
# Routes calls to FreeSWITCH dispatcher group 1.

####### Global Parameters #########

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

fork=yes
children=4

# Listen behind HAProxy (HAProxy → Kamailio:5061)
listen=udp:0.0.0.0:5061
listen=tcp:0.0.0.0:5061

tcp_connection_lifetime=3604
tcp_max_connections=2048

####### Modules Section ########

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "dispatcher.so"
loadmodule "dialog.so"
loadmodule "htable.so"

# Uncomment once PostgreSQL schema is ready:
# loadmodule "db_postgres.so"
# loadmodule "sqlops.so"

####### Module Parameters #########

# ----- tm -----
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# ----- rr -----
modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 0)

# ----- dispatcher -----
# Reads FreeSWITCH destinations from file (Phase 1).
# Replace with db_url once DB is ready (Phase 4).
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "ds_ping_interval", 10)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_probing_threshold", 2)
modparam("dispatcher", "ds_inactive_threshold", 1)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=404;code=480;code=486")
modparam("dispatcher", "ds_probing_mode", 1)

# ----- dialog -----
modparam("dialog", "enable_stats", 0)

####### Routing Logic ########

request_route {
    route(REQINIT);

    # Handle retransmissions
    if (t_precheck_trans()) {
        t_check_trans();
        exit;
    }
    t_check_trans();

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    if (is_method("ACK")) {
        route(DLGURI);
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    if (!is_method("REGISTER")) {
        loose_route();
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE: $fu => $tu | call-id=$ci | src=$si:$sp\n");
        route(DISPATCH);
    }

    route(RELAY);
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    # Respond to keepalive OPTIONS from HAProxy
    if (is_method("OPTIONS") && uri==myself && $rU==$null) {
        sl_send_reply("200", "Keepalive");
        exit;
    }
    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

route[DISPATCH] {
    # Select FreeSWITCH from group 1 using round-robin (algo 4)
    if (!ds_select_dst("1", "4")) {
        xlog("L_ERR", "No FreeSWITCH available in dispatcher group 1\n");
        sl_send_reply("503", "Service Unavailable – No Media Server");
        exit;
    }
    xlog("L_INFO", "Dispatching $ci to $du\n");
    t_on_failure("MANAGE_FAILURE");
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[DLGURI] {
    if (!isdsturiset()) {
        handle_ruri_alias();
    }
    return;
}

onreply_route {
    if (status=~"[12][0-9][0-9]" && ds_is_from_list()) {
        xlog("L_DEBUG", "Reply $rs from FreeSWITCH $si:$sp | call-id=$ci\n");
    }
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }
    if (t_check_status("500|503")) {
        xlog("L_WARN", "FreeSWITCH failure on $du, trying next\n");
        if (ds_next_dst()) {
            route(RELAY);
            exit;
        }
    }
    sl_send_reply("503", "All Media Servers Unavailable");
}
